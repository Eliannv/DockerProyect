services:
  servidor:
    build: ./servidor
    container_name: servidor-desarollo
    ports:
      - "3000:3000"
    volumes:
      - ./servidor:/app
      - /app/node_modules
  
  cliente:
    build: ./cliente
    environment:
      POSTGRES_USER: admin
    ports:
      - "5173:5173"
    volumes:
      - ./cliente:/app
      - /app/node_modules
    depends_on:
      - servidor

  postgres:
    image: postgres:17

    container_name: postgres-desarollo

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: arquitecturahexagonal

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  mongo:
    image: mongo:latest

    container_name: mongo-db

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  postgres-data:
  mongo_data: